<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaussian Mixture Model Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lang-bar">
  <div class="seg" id="seg-lang">
    <button data-value="en" class="active">English</button>
    <button data-value="vi">Tiếng Việt</button>
  </div>
</div>

<h1 data-i18n="app.title">Gaussian Mixture Model (GMM) Demo</h1>
<p class="sub" data-i18n="app.sub"></p>

<div class="layout">
  <div class="canvas-box">
    <div class="canvas-toolbar">
      <span class="toolbar-label" data-i18n="toolbar.view"></span>
      <div class="seg" id="seg-view">
        <button data-value="ellipse" class="active" data-i18n="view.ellipse"></button>
        <button data-value="mountain" data-i18n="view.mountain"></button>
      </div>
    </div>
    <canvas id="canvas" width="720" height="720"></canvas>
    <p class="hint" id="hint"></p>
  </div>

  <div class="panel">
    <section>
      <h2 data-i18n="sec.data"></h2>
      <div class="seg" id="seg-dim">
        <button data-value="1d" data-i18n="dim.1d"></button>
        <button data-value="2d" class="active" data-i18n="dim.2d"></button>
      </div>
      <label class="row">
        <span data-i18n="data.perClick"></span>
        <select id="points-per-click">
          <option>1</option><option>5</option><option>10</option>
          <option selected>20</option><option>50</option>
        </select>
        <span data-i18n="data.points"></span>
      </label>
      <label class="row">
        <span data-i18n="data.spread"></span>
        <input type="range" id="spread" min="5" max="120" value="35">
      </label>
      <div class="btn-row">
        <button id="btn-sample" class="ghost" data-i18n="btn.sample"></button>
        <button id="btn-clear" class="ghost danger" data-i18n="btn.clear"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="sec.train"></h2>
      <label class="row">
        <span data-i18n="train.clusters"></span>
        <select id="n-clusters">
          <option>1</option><option>2</option><option selected>3</option>
          <option>4</option><option>5</option>
        </select>
      </label>
      <div class="btn-row">
        <button id="btn-init" data-i18n="btn.init"></button>
      </div>
      <div class="btn-row">
        <button id="btn-e" data-i18n="btn.e"></button>
        <button id="btn-m" data-i18n="btn.m"></button>
      </div>
      <div class="btn-row">
        <button id="btn-1" data-i18n="btn.run1"></button>
        <button id="btn-10" data-i18n="btn.run10"></button>
      </div>
      <div class="btn-row">
        <button id="btn-auto" class="primary"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="sec.status"></h2>
      <div class="status">
        <div><span data-i18n="stat.n"></span><b id="stat-n">0</b></div>
        <div><span data-i18n="stat.iter"></span><b id="stat-iter">0</b></div>
        <div><span data-i18n="stat.ll"></span><b id="stat-ll">—</b></div>
      </div>
      <div id="params"></div>
      <p class="note" id="message"></p>
    </section>

    <section class="legend">
      <details id="legend-details">
        <summary><h2 data-i18n="sec.legend"></h2><span class="chevron">▾</span></summary>
      <ul>
        <li data-i18n-html="legend.1"></li>
        <li data-i18n-html="legend.2"></li>
        <li data-i18n-html="legend.3"></li>
        <li data-i18n-html="legend.4"></li>
      </ul>
      </details>
    </section>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
